name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate challenge catalog
        run: python3 validate_challenges.py

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble fixed-signed debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify fixed debug signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          EXPECTED="db2bf509cf41d8d287390db01f6dfc9d14d58dcf5667e7507fc02fedb1d6e04f"
          test "$CERT" = "$EXPECTED"
          echo "Fixed debug signing certificate verified: $CERT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tower-for-Two-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
